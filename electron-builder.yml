appId: com.cerbonesphoto.app
productName: CerbonesPhoto
electronUpdaterCompatibility: '>= 2.16'
publish:
  provider: github
  owner: dimaurovincenzo
  repo: CerbonesPhoto
  channel: latest
  releaseType: draft
directories:
  buildResources: build
asar: true
asarUnpack:
  - node_modules/exiftool-vendored.pl/**
  - node_modules/exiftool-vendored/**
extraResources:
  - from: resources/bin/darwin-arm64
    to: bin/darwin-arm64
  - from: resources/licenses
    to: licenses
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
mac:
  icon: build/icon.icns
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  # Il suffisso distingue lo ZIP consumato da Squirrel.Mac dal DMG per installazione manuale.
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  darkModeSupport: true
  minimumSystemVersion: '12.0'
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
npmRebuild: false
